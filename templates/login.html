<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SignAuth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .display-font { font-family: 'Playfair Display', serif; }

    .noise-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    input[type="text"], input[type="password"] {
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: #8B6A3E;
      box-shadow: 0 0 0 3px rgba(139,106,62,0.12);
    }

    .login-btn {
      background: linear-gradient(135deg, #8B6A3E 0%, #6b4f2c 100%);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(139,106,62,0.35);
    }
    .login-btn:active {
      transform: translateY(0);
    }

    .header-bar {
      background: linear-gradient(90deg, #1a1209 0%, #2d1f0e 50%, #1a1209 100%);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.6s ease forwards; }
    .delay-1 { animation-delay: 0.1s; opacity: 0; }
    .delay-2 { animation-delay: 0.2s; opacity: 0; }
    .delay-3 { animation-delay: 0.35s; opacity: 0; }
    .delay-4 { animation-delay: 0.5s; opacity: 0; }
  </style>
</head>
<body class="min-h-screen bg-[#fdf8f2] flex flex-col">

  <!-- Top Header Bar -->
  <header class="header-bar py-4 px-8 flex items-center justify-between shadow-lg relative z-10">
    <div class="flex items-center gap-3">
      <!-- Logo mark -->
      <div class="w-8 h-8 rounded-full border border-[#8B6A3E] flex items-center justify-center">
        <div class="w-3 h-3 bg-[#c9a96e] rounded-full"></div>
      </div>
      <span class="display-font text-3xl font-black tracking-tight text-white">
        Sign<span class="text-[#c9a96e]">Auth</span>
      </span>
    </div>
    <span class="text-[#8a7a66] text-sm font-light tracking-widest uppercase">Secure Access Portal</span>
  </header>

  <!-- Main Content -->
  <main class="flex flex-1 relative overflow-hidden noise-bg">

    <!-- Decorative background circles -->
    <div class="absolute -top-20 -left-20 w-72 h-72 rounded-full bg-[#8B6A3E] opacity-5 blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-0 right-1/3 w-96 h-96 rounded-full bg-[#c9a96e] opacity-5 blur-3xl pointer-events-none"></div>

    <!-- LEFT PANEL — Showcase Image -->
    <div class="w-1/2 relative overflow-hidden z-10">
      <!-- Full bleed image -->
      <img
        src="static/images/Unknown-5.jpg"
        alt="Showcase"
        class="absolute inset-0 w-full h-full object-cover"
      />
      <!-- Gradient overlay -->
      <div class="absolute inset-0 bg-gradient-to-tr from-[#1a1209cc] via-[#2d1f0e66] to-transparent"></div>

      <!-- Text overlay -->
      <div class="absolute bottom-12 left-10 right-10 z-10 fade-up delay-1">
        <p class="text-xs font-medium tracking-[0.25em] uppercase text-[#c9a96e] mb-3">Secure · Simple · Swift</p>
        <h2 class="display-font text-4xl font-black text-white leading-tight mb-3">
          Your gateway<br/>to everything.
        </h2>
        <p class="text-sm text-[#d4c4b0] leading-relaxed max-w-xs">
          One login. Total access. Built with security at its core.
        </p>
      </div>

      <!-- Decorative corner badge -->
      <div class="absolute top-8 left-8 w-12 h-12 rounded-full border border-[#c9a96e55] flex items-center justify-center fade-up delay-2">
        <div class="w-5 h-5 rounded-full border border-[#c9a96e] opacity-70"></div>
      </div>
    </div>

    <!-- Divider -->
    <div class="flex items-center justify-center relative z-10">
      <div class="w-px h-3/4 bg-gradient-to-b from-transparent via-[#d4c0a4] to-transparent"></div>
    </div>

    <!-- RIGHT PANEL — Login Form -->
    <div class="w-1/2 flex flex-col items-center justify-center p-16 relative z-10">
      <div class="w-full max-w-sm">

        <div class="fade-up delay-2">
          <p class="text-xs font-medium tracking-[0.2em] uppercase text-[#8B6A3E] mb-2">Welcome back</p>
          <h2 class="display-font text-4xl font-black text-[#1a1209] mb-1 leading-tight">Login</h2>
          <p class="text-sm text-[#7a6a58] mb-10">Enter your credentials to continue.</p>
        </div>

        <form action="/login" method="post" class="space-y-5">

          <!-- Username -->
          <div class="fade-up delay-3">
            <label for="username" class="block text-xs font-medium tracking-widest uppercase text-[#5a4a38] mb-2">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="your_username"
              required
              class="w-full bg-white border border-[#ddd0be] rounded-xl px-4 py-3 text-sm text-[#1a1209] placeholder-[#c0b0a0]"
            />
          </div>

          <!-- Password -->
          <div class="fade-up delay-3">
            <label for="password" class="block text-xs font-medium tracking-widest uppercase text-[#5a4a38] mb-2">Password</label>
            <div class="relative">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                required
                class="w-full bg-white border border-[#ddd0be] rounded-xl px-4 py-3 text-sm text-[#1a1209] placeholder-[#c0b0a0]"
              />
              <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#9a8878] hover:text-[#5a4a38] transition-colors">
                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              </button>
            </div>
            <div class="flex justify-end mt-2">
              <a href="#" class="text-xs text-[#8B6A3E] hover:underline">Forgot password?</a>
            </div>
          </div>

          <!-- Submit -->
          <div class="fade-up delay-4 pt-2">
            <button type="submit" class="login-btn w-full text-white font-medium py-3 rounded-xl text-sm tracking-wide shadow-md">
              Sign In →
            </button>
          </div>

          <!-- Error message slot -->
          
          <p class="text-red-500 text-sm text-center hidden" id="error-msg"></p>

          <div class="fade-up delay-4 text-center pt-2">
            <span class="text-xs text-[#9a8878]">Don't have an account? </span>
            <a href="#" class="text-xs font-medium text-[#8B6A3E] hover:underline">Create one</a>
          </div>

        </form>
      </div>
    </div>
  </main>

  <script>
    function togglePassword() {
      const pwd = document.getElementById('password');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
