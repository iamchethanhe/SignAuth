<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SignAuth</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
}

/* Background animation */
.bg-animate {
  position: fixed;
  inset: 0;
  z-index: -1;
  background: linear-gradient(270deg, #0f0f0f, #1a1209, #2b1d0f, #0f0f0f);
  background-size: 600% 600%;
  animation: gradientMove 15s ease infinite;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Glass card */
.glass {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.08);
}

/* Inputs */
.input-box {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  color: white;
}

.input-box:focus {
  border-color: #c9a96e;
  box-shadow: 0 0 0 2px rgba(201,169,110,0.2);
  outline: none;
}

/* Button */
.btn-main {
  background: linear-gradient(135deg,#c9a96e,#8B6A3E);
}

.btn-main:hover {
  opacity: 0.9;
}
</style>
</head>

<body class="min-h-screen flex items-center justify-center px-6">

<!-- BACKGROUND -->
<div class="bg-animate"></div>

<div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-2 gap-10 items-center">

  <!-- LEFT -->
  <div class="text-white space-y-6 hidden lg:block">
    <h1 class="text-5xl font-semibold">
      Sign<span class="text-[#c9a96e]">Auth</span>
    </h1>

    <p class="text-gray-400 max-w-md">
      AI-powered signature verification and forgery detection platform.
    </p>

    <div class="flex gap-4 mt-6">
      <div class="px-4 py-2 bg-white/10 rounded-lg text-sm">AI Detection</div>
      <div class="px-4 py-2 bg-white/10 rounded-lg text-sm">Secure</div>
      <div class="px-4 py-2 bg-white/10 rounded-lg text-sm">Fast</div>
    </div>
  </div>

  <!-- LOGIN CARD -->
  <div class="glass p-10 rounded-2xl shadow-2xl text-white">

    <h2 class="text-2xl font-semibold mb-2">Welcome Back</h2>
    <p class="text-sm text-gray-400 mb-6">Login to continue</p>

    <form action="/login" method="post" onsubmit="loading()">

      <!-- Username -->
      <div class="mb-4">
        <label class="text-sm text-gray-300">Username</label>
        <input type="text" name="username" required
          class="w-full mt-2 px-4 py-3 rounded-lg input-box"/>
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label class="text-sm text-gray-300">Password</label>

        <div class="relative">
          <input type="password" id="password" name="password" required
            class="w-full mt-2 px-4 py-3 rounded-lg input-box pr-10"/>

          <!-- 👁 SVG EYE ICON -->
          <button type="button" onclick="togglePassword()"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">

            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg"
              class="w-5 h-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">

              <!-- eye open -->
              <path id="eyeOpen"
                stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>

              <path id="eyeOpen2"
                stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M2.458 12C3.732 7.943 7.523 5 12 5
                c4.478 0 8.268 2.943 9.542 7
                -1.274 4.057-5.064 7-9.542 7
                -4.477 0-8.268-2.943-9.542-7z"/>
            </svg>

          </button>
        </div>
      </div>

      <!-- ERROR -->
      {% if error %}
      <p class="text-red-400 text-sm mb-3">{{ error }}</p>
      {% endif %}

      <!-- BUTTON -->
      <button id="btn"
        class="btn-main w-full py-3 rounded-lg font-medium mt-2">
        Sign In →
      </button>

    </form>

  </div>

</div>

<script>
function loading(){
  document.getElementById("btn").innerText = "Signing in...";
}

function togglePassword(){
  const pwd = document.getElementById("password");

  if(pwd.type === "password"){
    pwd.type = "text";
  } else {
    pwd.type = "password";
  }
}
</script>

</body>
</html>
