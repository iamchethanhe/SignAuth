<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register • SignAuth</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      width:100%;
      min-height:100vh;

      font-family:'Poppins',sans-serif;

      overflow:hidden;

      background:white;
    }

    /* ======================================
       MAIN CONTAINER
    ====================================== */

    .container{

      width:100%;
      height:100vh;

      display:grid;

      grid-template-columns:1fr 1fr;
    }

    /* ======================================
       LEFT SIDE
    ====================================== */

    .left-side{

      width:100%;
      height:100vh;

      background:#eef5fb;

      display:flex;

      flex-direction:column;

      align-items:center;

      justify-content:center;

      padding:30px 40px;

      gap:35px;

      position:relative;
    }

    /* ======================================
       BACK BUTTON
    ====================================== */

    .back-btn{

      position:absolute;

      top:30px;

      left:30px;

      width:56px;

      height:56px;

      border-radius:18px;

      background:white;

      display:flex;

      align-items:center;

      justify-content:center;

      transition:0.3s ease;

      box-shadow:
      0 10px 30px rgba(15,23,42,0.10);
    }

    .back-btn:hover{

      transform:translateY(-2px);
    }

    /* ======================================
       LOGO
    ====================================== */

    .brand{

      font-size:82px;

      font-weight:800;

      color:#0f172a;

      line-height:1;

      text-align:center;

      width:100%;

      display:flex;

      justify-content:center;

      align-items:center;
    }

    .brand span{

      color:#38bdf8;
    }

    /* ======================================
       IMAGE
    ====================================== */

    .image-wrapper{

      width:88%;

      max-width:700px;

      border:10px solid white;

      border-radius:34px;

      overflow:hidden;

      box-shadow:
      0 22px 60px rgba(15,23,42,0.16);

      animation:floatImage 5s ease-in-out infinite;

      display:flex;

      justify-content:center;

      align-items:center;
    }

    .bg-image{

      width:100%;

      height:100%;

      object-fit:cover;

      display:block;

      animation:zoomImage 10s ease-in-out infinite alternate;
    }

    @keyframes floatImage{

      0%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(-15px);
      }

      100%{
        transform:translateY(0px);
      }
    }

    @keyframes zoomImage{

      0%{
        transform:scale(1);
      }

      100%{
        transform:scale(1.05);
      }
    }

    /* ======================================
       RIGHT SIDE
    ====================================== */

    .right-side{

      width:100%;
      height:100vh;

      background:white;

      display:flex;

      align-items:center;

      justify-content:center;

      padding:40px;
    }

    .form-box{

      width:100%;

      max-width:430px;
    }

    .form-box h2{

      font-size:68px;

      font-weight:800;

      color:#0f172a;

      margin-bottom:10px;

      text-align:center;
    }

    .sub-text{

      color:#64748b;

      font-size:16px;

      margin-bottom:35px;

      text-align:center;
    }

    /* ======================================
       ALERT
    ====================================== */

    .error-box{

      background:#fef2f2;

      border:1px solid #fecaca;

      color:#991b1b;

      padding:14px;

      border-radius:14px;

      margin-bottom:18px;

      font-size:14px;
    }

    /* ======================================
       INPUTS
    ====================================== */

    .input-group{

      margin-bottom:18px;
    }

    .input-box{

      width:100%;

      height:64px;

      border:1px solid #dbe2ea;

      border-radius:18px;

      padding:0 22px;

      font-size:16px;

      outline:none;

      transition:0.3s ease;

      background:white;
    }

    .input-box:focus{

      border-color:#38bdf8;

      box-shadow:
      0 0 0 4px rgba(56,189,248,0.10);
    }

    .input-box::placeholder{

      color:#94a3b8;
    }

    select.input-box{

      appearance:none;

      cursor:pointer;
    }

    /* ======================================
       BUTTON
    ====================================== */

    .register-btn{

      width:100%;

      height:64px;

      border:none;

      border-radius:18px;

      background:#38bdf8;

      color:white;

      font-size:16px;

      font-weight:700;

      cursor:pointer;

      transition:0.3s ease;

      margin-top:8px;
    }

    .register-btn:hover{

      background:#0ea5e9;

      transform:translateY(-2px);
    }

    /* ======================================
       FOOTER
    ====================================== */

    .footer-text{

      margin-top:25px;

      text-align:center;

      font-size:15px;

      color:#64748b;
    }

    .footer-text a{

      color:#38bdf8;

      text-decoration:none;

      font-weight:700;
    }

    .footer-text a:hover{

      text-decoration:underline;
    }

    /* ======================================
       SECRET KEY
    ====================================== */

    #secretKeyDiv{

      display:none;
    }

    /* ======================================
       MOBILE
    ====================================== */

    @media(max-width:950px){

      body{

        overflow:auto;
      }

      .container{

        grid-template-columns:1fr;
      }

      .left-side{

        height:auto;

        padding:45px 25px;
      }

      .brand{

        font-size:58px;
      }

      .image-wrapper{

        width:100%;
      }

      .right-side{

        height:auto;

        padding:55px 25px;
      }

      .form-box h2{

        font-size:52px;
      }
    }

  </style>

</head>

<body>

  <div class="container">

    <!-- LEFT SIDE -->
    <div class="left-side">

      <!-- BACK -->
      <a href="/" class="back-btn">

        <svg
          class="w-6 h-6 text-slate-900"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          viewBox="0 0 24 24"
        >

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 19l-7-7 7-7"
          />

        </svg>

      </a>

      <!-- LOGO -->
      <div class="brand">

        Sign<span>Auth</span>

      </div>

      <!-- IMAGE -->
      <div class="image-wrapper">

        <img
          src="{{ url_for('static', filename='images/register.png') }}"
          alt="Register Image"
          class="bg-image"
        >

      </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="right-side">

      <div class="form-box">

        <h2>

          Register

        </h2>

        <p class="sub-text">

          Create your account

        </p>

        <!-- ERROR -->
        {% if error %}

        <div class="error-box">

          {{ error }}

        </div>

        {% endif %}

        <!-- FORM -->
        <form action="/register_user" method="POST">

          <!-- FULL NAME -->
          <div class="input-group">

            <input
              type="text"
              name="fullname"
              required
              placeholder="Full Name"
              class="input-box"
            >

          </div>

          <!-- EMAIL -->
          <div class="input-group">

            <input
              type="email"
              name="email"
              required
              placeholder="Email Address"
              class="input-box"
            >

          </div>

          <!-- PASSWORD -->
          <div class="input-group">

            <input
              type="password"
              name="password"
              required
              placeholder="Password"
              class="input-box"
            >

          </div>

          <!-- ROLE -->
          <div class="input-group">

            <select
              name="role"
              id="role"
              onchange="toggleSecretKey()"
              class="input-box"
            >

              <option value="user">

                User Account

              </option>

              <option value="admin">

                Admin Account

              </option>

            </select>

          </div>

          <!-- SECRET KEY -->
          <div id="secretKeyDiv">

            <div class="input-group">

              <input
                type="text"
                name="secret_key"
                placeholder="Admin Secret Key"
                class="input-box"
              >

            </div>

          </div>

          <!-- BUTTON -->
          <button
            type="submit"
            class="register-btn"
          >

            CREATE ACCOUNT

          </button>

        </form>

        <!-- FOOTER -->
        <div class="footer-text">

          Already have an account?

          <a href="/">

            Login

          </a>

        </div>

      </div>

    </div>

  </div>

  <script>

    function toggleSecretKey(){

      const role = document.getElementById("role").value;

      const secretDiv = document.getElementById("secretKeyDiv");

      if(role === "admin"){

        secretDiv.style.display = "block";
      }

      else{

        secretDiv.style.display = "none";
      }
    }

  </script>

</body>

</html>
